<!DOCTYPE html>
<html lang="es">
	<head>
		<title>Skin Pro - Intro</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
            
            /* --- ESTILOS DE CARGA --- */
            #loading {
                position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                color: white; font-size: 24px; pointer-events: none; z-index: 10;
                text-shadow: 0 0 10px rgba(0,0,0,0.5);
            }

            /* --- ESTILOS DE LA INTERFAZ (TEXTO Y BOTÓN) --- */
            #ui-container {
                position: absolute;
                bottom: 40px; 
                left: 50%;
                transform: translateX(-50%); 
                text-align: center;
                z-index: 20; 
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 15px; 
            }

            .credits {
                color: rgba(255, 255, 255, 0.9);
                font-size: 14px;
                letter-spacing: 1px;
                text-transform: uppercase;
                text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
                font-weight: 600;
            }

            .btn-continue {
                background-color: #f37021; 
                color: white;
                border: none;
                padding: 12px 40px;
                font-size: 18px;
                font-weight: bold;
                border-radius: 30px; 
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(243, 112, 33, 0.4);
                text-decoration: none; 
            }

            .btn-continue:hover {
                background-color: #d15b15; 
                transform: scale(1.05); 
                box-shadow: 0 6px 20px rgba(243, 112, 33, 0.6);
            }

		</style>
	</head>
	<body>

        <div id="loading">Cargando Skin Pro...</div>

        <div id="ui-container">
            <div class="credits">Creado por: Martin Betancourt y Fabian Guerrero</div>
            <button id="btn-next" class="btn-continue">CONTINUAR</button>
        </div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Sky } from 'three/addons/objects/Sky.js';
            import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			let camera, scene, renderer;
			let sky, sun;
            let logoModel;

			init();
            animate();

			function init() {

                // --- AQUÍ ESTÁ EL CAMBIO PARA IR AL MENÚ ---
                document.getElementById('btn-next').addEventListener('click', function() {
                    // Redirige al archivo menu.html
                    window.location.href = "menu.html"; 
                });

				// 1. CONFIGURACIÓN DE ESCENA
				camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 0.1, 20000 );
				camera.position.set( 0, 0, 15 );

				scene = new THREE.Scene();

				renderer = new THREE.WebGLRenderer({ antialias: true });
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.5;
				document.body.appendChild( renderer.domElement );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
                controls.enablePan = false; 
                controls.minDistance = 5;
                controls.maxDistance = 50;

				initSky();

                const ambientLight = new THREE.AmbientLight( 0xffffff, 0.8 );
                scene.add( ambientLight );

                const dirLight = new THREE.DirectionalLight( 0xffffff, 3 );
                dirLight.position.set( -10, 10, -10 );
                scene.add( dirLight );

                // Carga del Logo
                const loader = new GLTFLoader();
                loader.load( './logo.glb', function ( gltf ) {
                    logoModel = gltf.scene;
                    const box = new THREE.Box3().setFromObject( logoModel );
                    const center = box.getCenter( new THREE.Vector3() );
                    const size = box.getSize( new THREE.Vector3() );

                    logoModel.position.x += ( logoModel.position.x - center.x );
                    logoModel.position.y += ( logoModel.position.y - center.y );
                    logoModel.position.z += ( logoModel.position.z - center.z );

                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 8 / maxDim; 
                    logoModel.scale.setScalar(scale);

                    logoModel.traverse((child) => {
                        if (child.isMesh) {
                            child.material.envMapIntensity = 1.5; 
                        }
                    });

                    scene.add( logoModel );
                    document.getElementById('loading').style.display = 'none';

                }, undefined, function ( error ) {
                    console.error( error );
                    document.getElementById('loading').innerText = 'Error: logo.glb no encontrado';
                    document.getElementById('loading').style.color = '#ff3333';
                } );

				window.addEventListener( 'resize', onWindowResize );
			}

			function initSky() {
				sky = new Sky();
				sky.scale.setScalar( 450000 );
				scene.add( sky );

				sun = new THREE.Vector3();

				const effectController = {
					turbidity: 10,
					rayleigh: 3,
					mieCoefficient: 0.005,
					mieDirectionalG: 0.7,
					elevation: 2,   
					azimuth: 180,
					exposure: renderer.toneMappingExposure
				};

				const uniforms = sky.material.uniforms;
				uniforms[ 'turbidity' ].value = effectController.turbidity;
				uniforms[ 'rayleigh' ].value = effectController.rayleigh;
				uniforms[ 'mieCoefficient' ].value = effectController.mieCoefficient;
				uniforms[ 'mieDirectionalG' ].value = effectController.mieDirectionalG;

				const phi = THREE.MathUtils.degToRad( 90 - effectController.elevation );
				const theta = THREE.MathUtils.degToRad( effectController.azimuth );
				sun.setFromSphericalCoords( 1, phi, theta );
				uniforms[ 'sunPosition' ].value.copy( sun );
			}

			function onWindowResize() {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );
			}

			function animate() {
                requestAnimationFrame( animate );
                if ( logoModel ) {
                    logoModel.rotation.y += 0.005; 
                }
				renderer.render( scene, camera );
			}

		</script>
	</body>
</html>
