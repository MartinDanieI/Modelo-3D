<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>SKIN PRO - Visualizador 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #000;
        }

        /* --- PANTALLA DE CARGA --- */
        #loading-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        .loader {
            border: 5px solid #333;
            border-top: 5px solid #ff6600;
            /* Naranja SkinPro */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #progress-text {
            color: white;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* --- UI BOTONES DE COLORES (REVERTIDO A ABAJO) --- */
        #ui-controls {
            position: absolute;
            left: 50%;
            /* Centrado horizontal */
            bottom: 40px;
            /* Pegado abajo */
            transform: translateX(-50%);
            /* Ajuste fino de centro */
            display: flex;
            flex-direction: row;
            /* Horizontal */
            align-items: center;
            gap: 15px;
            z-index: 100;
            background: rgba(20, 20, 20, 0.8);
            /* Fondo oscuro más sólido */
            padding: 15px 30px;
            border-radius: 50px;
            /* Bordes muy redondos (estilo cápsula) */
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .color-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.2);
            border-color: white;
        }

        /* Separador vertical (REVERTIDO) */
        .separator {
            width: 1px;
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 10px;
        }

        /* --- MOVER GUI (SOL) A LA IZQUIERDA --- */
        .lil-gui.root {
            right: auto !important;
            left: 15px !important;
            top: 15px !important;
        }

        /* --- CUADRO DE INFORMACIÓN (BAJADO PARA NO TAPAR CONTROLES) --- */
        #info-panel {
            position: absolute;
            top: 100px;
            /* <--- BAJADO (Antes 30px) para dejar espacio al GUI */
            right: 20px;
            width: 300px;
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-height: 70vh;
            overflow-y: auto;
            z-index: 90;
            /* Z-index menor que el GUI (que suele ser 1000) */
            transition: all 0.3s ease;
        }

        #info-panel h2 {
            margin-top: 0;
            font-size: 22px;
            border-bottom: 2px solid #ff6600;
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: 800;
        }

        #model-description {
            font-size: 14px;
            line-height: 1.6;
            color: #e0e0e0;
        }

        #model-description b {
            color: #ffaa66;
        }

        /* Botón de volver (Estilo texto como en la imagen) */
        .text-button {
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .text-button:hover {
            color: #ff6600;
        }

        /* Responsive para móviles */
        @media (max-width: 768px) {
            #info-panel {
                top: auto;
                /* Anular el top */
                bottom: 120px;
                /* Subirlo para que no tape los botones */
                right: 20px;
                left: 20px;
                width: auto;
                max-height: 30vh;
            }

            #ui-controls {
                width: 90%;
                justify-content: center;
                bottom: 20px;
                padding: 10px;
            }
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="loading-screen">
        <div class="loader"></div>
        <div id="progress-text">CARGANDO...</div>
    </div>

    <div id="ui-controls">
        <div class="color-btn" style="background: #00BFFF; box-shadow: 0 0 10px #00BFFF;"
            onclick="cambiarCamisa('celeste')"></div>
        <div class="color-btn" style="background: #FFD700; box-shadow: 0 0 10px #FFD700;"
            onclick="cambiarCamisa('colombia')"></div>
        <div class="color-btn" style="background: #800080; box-shadow: 0 0 10px #800080;"
            onclick="cambiarCamisa('morada')"></div>
        <div class="color-btn" style="background: #FF4500; box-shadow: 0 0 10px #FF4500;"
            onclick="cambiarCamisa('naranja')"></div>
        <div class="color-btn" style="background: #FF0000; box-shadow: 0 0 10px #FF0000;"
            onclick="cambiarCamisa('roja')"></div>
        <div class="color-btn" style="background: #008000; box-shadow: 0 0 10px #008000;"
            onclick="cambiarCamisa('verde')"></div>

        <div class="separator"></div>

        <a href="index.html" class="text-button">
            Volver al Menú
        </a>
    </div>

    <div id="info-panel">
        <h2 id="model-title">Cargando...</h2>
        <div id="model-description"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Water } from 'three/addons/objects/Water.js';
        import { Sky } from 'three/addons/objects/Sky.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        // --- BASE DE DATOS DE INFORMACIÓN ---
        const modelsInfo = [
            {
                id: 'colombia',
                name: 'Jersey Colombia',
                description: '<b>Edición:</b> Selección Colombia\n<b>Tecnología:</b> Protección UV, secado rápido.\n<b>Detalles:</b> Tricolor nacional con patrón geométrico.\n<b>Material:</b> Poliéster transpirable de alta gama.'
            },
            {
                id: 'celeste',
                name: 'Jersey Azul Pro',
                description: '<b>Tipo:</b> Jersey de Ciclismo Profesional\n<b>Tecnología:</b> Absorción y secado rápido.\n<b>Confección:</b> Tres bolsillos traseros ergonómicos.\n<b>Material:</b> Textil liviano y aerodinámico.'
            },
            {
                id: 'morada',
                name: 'Jersey Morado Elite',
                description: '<b>Estilo:</b> Elite Performance\n<b>Color:</b> Púrpura profundo con detalles neón.\n<b>Uso:</b> Ideal para rutas largas y clima variable.\n<b>Ajuste:</b> Fit de competición.'
            },
            {
                id: 'naranja',
                name: 'Jersey Naranja Energy',
                description: '<b>Visibilidad:</b> Alta visibilidad en carretera.\n<b>Tecnología:</b> Anti-manchas de sudor.\n<b>Diseño:</b> Inspirado en la energía cinética.\n<b>Comodidad:</b> Costuras planas para evitar roces.'
            },
            {
                id: 'roja',
                name: 'Jersey Rojo Fire',
                description: '<b>Colección:</b> Fire Series\n<b>Características:</b> Malla lateral para ventilación extra.\n<b>Protección:</b> Factor UV 50+.\n<b>Resistencia:</b> Colores vivos que no destiñen.'
            },
            {
                id: 'verde',
                name: 'Jersey Verde Nature',
                description: '<b>Concepto:</b> Conexión con la montaña.\n<b>Material:</b> Fibras recicladas de alto rendimiento.\n<b>Bolsillos:</b> Cremallera de seguridad trasera.\n<b>Sensación:</b> Segunda piel.'
            }
        ];

        // 1. SETUP ESCENA
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 20000);
        camera.position.set(0, 15, 45);

        // 2. OCÉANO Y CIELO
        const sun = new THREE.Vector3();
        const waterGeometry = new THREE.PlaneGeometry(10000, 10000);
        const water = new Water(waterGeometry, {
            textureWidth: 512, textureHeight: 512,
            waterNormals: new THREE.TextureLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/waternormals.jpg', function (texture) {
                texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            }),
            sunDirection: new THREE.Vector3(),
            sunColor: 0xffffff,
            waterColor: 0x001e0f,
            distortionScale: 3.7
        });
        water.rotation.x = - Math.PI / 2;
        scene.add(water);

        const sky = new Sky();
        sky.scale.setScalar(10000);
        scene.add(sky);

        const parameters = {
            elevation: 2,
            azimuth: 180,
            turbidity: 10,
            rayleigh: 3,
            mieCoefficient: 0.005,
            mieDirectionalG: 0.7,
            exposure: renderer.toneMappingExposure
        };

        const pmremGenerator = new THREE.PMREMGenerator(renderer);

        function updateSun() {
            const phi = THREE.MathUtils.degToRad(90 - parameters.elevation);
            const theta = THREE.MathUtils.degToRad(parameters.azimuth);
            sun.setFromSphericalCoords(1, phi, theta);

            sky.material.uniforms['sunPosition'].value.copy(sun);
            sky.material.uniforms['turbidity'].value = parameters.turbidity;
            sky.material.uniforms['rayleigh'].value = parameters.rayleigh;
            sky.material.uniforms['mieCoefficient'].value = parameters.mieCoefficient;
            sky.material.uniforms['mieDirectionalG'].value = parameters.mieDirectionalG;

            water.material.uniforms['sunDirection'].value.copy(sun).normalize();

            // Si es de noche (elevación baja), reducir intensidad del ambiente
            if (parameters.elevation < 0) {
                renderer.toneMappingExposure = 0.2;
            } else {
                renderer.toneMappingExposure = parameters.exposure;
            }

            scene.environment = pmremGenerator.fromScene(sky).texture;
        }
        updateSun();

        // 3. CARGA DE MODELOS
        const manager = new THREE.LoadingManager();
        manager.onLoad = () => {
            const screen = document.getElementById('loading-screen');
            screen.style.opacity = '0';
            setTimeout(() => screen.style.display = 'none', 500);
        };

        const loader = new GLTFLoader(manager);
        let currentMesh = null;

        // CONTROLES DE CÁMARA
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.maxPolarAngle = Math.PI * 0.495;
        controls.minDistance = 20;
        controls.maxDistance = 150;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.enableDamping = true;

        // FUNCIÓN PRINCIPAL PARA CAMBIAR CAMISA E INFORMACIÓN
        window.cambiarCamisa = function (id) {

            // 1. Cargar el modelo 3D
            const ruta = `camisetas/Camisa_${id}.glb`;

            loader.load(ruta, (gltf) => {
                if (currentMesh) scene.remove(currentMesh);

                const model = gltf.scene;
                model.scale.set(5, 5, 5);
                model.position.set(0, 8, 0);

                model.traverse(child => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                currentMesh = model;
                scene.add(currentMesh);

                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                controls.target.copy(center);
                controls.update();
            }, undefined, function (error) {
                console.error("Error cargando modelo:", error);
            });

            // 2. Actualizar el Panel de Información
            const info = modelsInfo.find(m => m.id === id);
            const titleEl = document.getElementById('model-title');
            const descEl = document.getElementById('model-description');

            // Efecto de desvanecimiento simple para el texto
            titleEl.style.opacity = 0;
            descEl.style.opacity = 0;

            setTimeout(() => {
                if (info) {
                    titleEl.innerText = info.name;
                    descEl.innerHTML = info.description.replace(/\n/g, '<br>');
                } else {
                    titleEl.innerText = "Modelo Desconocido";
                    descEl.innerHTML = "No hay información disponible para este modelo.";
                }
                titleEl.style.opacity = 1;
                descEl.style.opacity = 1;
            }, 300);
        };

        // Carga inicial
        const params = new URLSearchParams(window.location.search);
        const modeloInicial = params.get('modelo') || 'celeste';
        cambiarCamisa(modeloInicial);

        // --- CONTROLES GUI (AGREGADOS NUEVAMENTE) ---
        const gui = new GUI();

        // Carpeta Clima (Sol) - AHORA SUPER CATERGADA
        const folderSky = gui.addFolder('Clima Avanzado');
        folderSky.add(parameters, 'elevation', -10, 90, 0.1).name('Hora (Elevación Sol)').onChange(updateSun);
        folderSky.add(parameters, 'azimuth', -180, 180, 0.1).name('Rotación Sol').onChange(updateSun);
        folderSky.add(parameters, 'exposure', 0, 1, 0.001).name('Exposición (Luz)').onChange(updateSun);

        // Opciones avanzadas de atmósfera
        folderSky.add(parameters, 'turbidity', 0.0, 20.0, 0.1).name('Niebla/Turbidez').onChange(updateSun);
        folderSky.add(parameters, 'rayleigh', 0.0, 4, 0.001).name('Dispersión (Cielo)').onChange(updateSun);
        folderSky.add(parameters, 'mieCoefficient', 0.0, 0.1, 0.001).name('Brillo Sol').onChange(updateSun);
        folderSky.add(parameters, 'mieDirectionalG', 0.0, 1, 0.001).name('Halo Solar').onChange(updateSun);
        folderSky.open();

        // Carpeta Océano (Agregada de nuevo)
        const folderWater = gui.addFolder('Océano');
        folderWater.add(water.material.uniforms.distortionScale, 'value', 0, 8, 0.1).name('Turbulencia');
        folderWater.add(water.material.uniforms.size, 'value', 0.1, 10, 0.1).name('Tamaño Olas');
        folderWater.open(); // Mantener abierta para ver



        // --- PARÁMETROS DE ANIMACIÓN ---
        const animParams = {
            cameraSpeed: 1.0,
            shirtRotationSpeed: 0.0, // Por defecto quieta, pero configurable
            shirtFloatSpeed: 1.0,    // Velocidad de la flotación
            stopAll: false           // Botón de pánico para detener todo
        };



        // ... (Código existente de Clima - se mantiene igual, no lo toco en este replace) ...

        const folderAnim = gui.addFolder('Animación & Movimiento');

        folderAnim.add(animParams, 'cameraSpeed', 0, 10, 0.1).name('Giro Cámara').onChange(v => {
            controls.autoRotateSpeed = v;
        });

        folderAnim.add(animParams, 'shirtRotationSpeed', -5, 5, 0.1).name('Giro Camisa');

        folderAnim.add(animParams, 'shirtFloatSpeed', 0, 5, 0.1).name('Velocidad Flote');

        folderAnim.add(animParams, 'stopAll').name('⏹ DETENER TODO').onChange(v => {
            if (v) {
                // Guardar valores previos si se quisiera restaurar, 
                // para simplificar, ponemos los controles a 0 visualmente
                controls.autoRotate = false;
                animParams.shirtRotationSpeed = 0;
                animParams.shirtFloatSpeed = 0;
                // Actualizar GUI para reflejar
                gui.controllersRecursive().forEach(c => c.updateDisplay());
            } else {
                controls.autoRotate = true;
                animParams.cameraSpeed = 1.0; // Restaurar valores por defecto o previos
                animParams.shirtFloatSpeed = 1.0;
                controls.autoRotateSpeed = 1.0;
                gui.controllersRecursive().forEach(c => c.updateDisplay());
            }
        });
        folderAnim.open();

        // 5. ANIMACIÓN
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;

            if (currentMesh) {
                // Flotación controlada
                if (animParams.shirtFloatSpeed > 0) {
                    currentMesh.position.y = Math.sin(time * animParams.shirtFloatSpeed) * 1.5 + 8;
                } else if (animParams.stopAll) {
                    // Si está detenido, mantener posición actual o resetear? Mejor dejar quieto.
                    // Al ser sin(time), 'time' sigue corriendo. Para congelar requeriría offset.
                    // Simplificación: sigo calculando pero con velocidad 0 se moverá muy lento o nada si es multiplo?
                    // if floatSpeed es 0, sin(0) = 0. Position será fija en 8.
                    currentMesh.position.y = 8;
                }

                // Rotación manual de la camisa
                if (Math.abs(animParams.shirtRotationSpeed) > 0.01) {
                    currentMesh.rotation.y += animParams.shirtRotationSpeed * 0.01;
                }
            }

            // Actualizar velocidad de cámara en tiempo real (si no está detenido)
            if (!animParams.stopAll) {
                controls.autoRotateSpeed = animParams.cameraSpeed;
            }

            water.material.uniforms['time'].value += 1.0 / 60.0;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        updateSun();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
